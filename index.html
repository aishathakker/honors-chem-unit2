</style></head><body><header><div class="logo">A</div><nav class="links"><a href="#/">Home</a><a href="#/topics">Study Guides</a><a href="#/practice">Practice</a><a href="#/progress">Progress</a><a href="#/planner">Planner</a></nav><span class="user">♡ &nbsp; Aisha's Study Lab</span></header><main id="app" class="container"></main><div class="watermark"><span>A</span><small>AISHA</small></div><script>
const units=[
{id:"energy",name:"Thermal Energy & Thermometers",brief:"Particle motion, energy transfer and expansion",body:"Heat is energy transferred because of a temperature difference. When the surroundings are warmer than the thermometer, energy transfers into its alcohol. Its particles move faster and spread farther apart, so the alcohol expands and rises. In cooler surroundings, energy transfers out, particles move more slowly, and the level falls.",facts:["Temperature reflects average particle kinetic energy; total thermal energy also depends on how much matter is present.","Alcohol thermometers rely on thermal expansion.","A heated metal jar lid can expand enough to loosen."]},
{id:"particles",name:"Kinetic Molecular Theory",brief:"States of matter and particle diagrams",body:"Matter is made of particles in continuous random motion. Solid particles mainly vibrate in fixed positions; liquid particles stay close and move around one another; gas particles are far apart and move freely. Faster-moving gas particles cause stronger and more frequent wall collisions when volume is fixed.",facts:["Hotter gas particles move faster on average.","Particle number is not automatically changed by heating.","Gas particles must be drawn spread throughout their container."]},
{id:"temperature",name:"Celsius, Kelvin & STP",brief:"Absolute temperature and conversion",body:"Celsius uses water's freezing point (0 °C) and boiling point (100 °C) at standard atmospheric pressure. Gas-law calculations require Kelvin, an absolute temperature scale. K = °C + 273.15. In these worksheets, standard temperature is 273.15 K (0 °C) and standard pressure is 1 atm.",facts:["Always convert temperatures to Kelvin before using gas-law ratios.","A change from 100 °C to 50 °C is NOT a halving of absolute temperature.","At constant pressure, gas volume is directly proportional to Kelvin temperature."]},
{id:"pressure",name:"Gas Pressure & Measuring It",brief:"Collisions, barometers and manometers",body:"Pressure is force per unit area. Gas pressure comes from particles colliding with the walls of their container. A barometer measures atmospheric pressure; an open-end manometer compares gas pressure with atmospheric pressure. If mercury is higher on the atmospheric side, the gas pressure is greater than atmospheric pressure.",facts:["P = F / A.","1 atm = 760 mmHg = 760 torr = 101.3 kPa = 14.7 psi.","Atmospheric pressure generally decreases as altitude increases."]},
{id:"boyle",name:"Boyle's Law",brief:"Pressure–volume relationships",body:"At constant temperature and amount of gas, pressure and volume vary inversely: P₁V₁ = P₂V₂. Compressing the gas gives its particles less room, so wall collisions occur more often. Graphing P versus V gives a decreasing curve, not a straight line.",facts:["P₂ = P₁ × V₁ / V₂.","A decrease in volume causes an increase in pressure when T and n stay constant.","Use consistent volume units."]},
{id:"charles",name:"Charles's & Gay-Lussac's Laws",brief:"Gas temperature relationships",body:"At constant pressure and gas amount, volume is proportional to absolute temperature: V₁/T₁ = V₂/T₂. At constant volume and amount, pressure is proportional to absolute temperature: P₁/T₁ = P₂/T₂. Both temperatures must be in Kelvin.",facts:["Heating gas in a flexible container increases its volume if pressure remains constant.","Heating gas in a rigid sealed container increases pressure.","A pressure-versus-Celsius graph does not pass through the origin."]},
{id:"amount",name:"Particles, Pressure & PVTn",brief:"Changing the number of gas particles",body:"At constant temperature and volume, pressure is proportional to the amount of gas: P₂ = P₁(n₂/n₁). More particles means more wall collisions. If several variables change, multiply by the correctly oriented ratio for each changed variable.",facts:["P is proportional to n when T and V are constant.","At constant temperature: P₂ = P₁ × (V₁/V₂) × (n₂/n₁).","Predict increase/decrease BEFORE calculating."]},
{id:"calculations",name:"Combined Gas-Law Calculations",brief:"PVTn tables, ratios and word problems",body:"When gas amount is constant, P₁V₁/T₁ = P₂V₂/T₂. Rearrange for the missing quantity and use Kelvin. Your Worksheet 3 uses a PVTn chart: list starting and final values, determine the effect of each change, then multiply by the appropriate ratios.",facts:["P₂ = P₁(V₁/V₂)(T₂/T₁).","V₂ = V₁(P₁/P₂)(T₂/T₁).","If gas amount changes too, include n₂/n₁ for pressure or n₂/n₁ for volume as appropriate when other conditions are specified."]},
{id:"labs",name:"Lab Data & Graphs",brief:"Syringe, flask and thermometer experiments",body:"Your syringe experiment showed pressure decreasing as volume increased: 5 mL corresponded to 99.7 kPa, while 15 mL corresponded to 38.4 kPa. Your particle-number lab showed pressure increasing from 19.5 to 89.7 kPa as the number of air puffs grew from one to six. Your temperature lab was intended to show increasing pressure with Kelvin temperature, although some observations were inconsistent.",facts:["Pressure vs volume: inverse curved trend.","Pressure vs particle amount: directly related.","Pressure vs Kelvin: direct proportionality at constant V and n; experimental error can obscure a trend."]}
];
const Q=[
["At fixed volume, heating gas normally makes its pressure ...",["Decrease","Increase","Stay constant"],1,"Faster particles make more forceful and frequent wall collisions.","temperature"],
["Which instrument measures atmospheric pressure?",["Manometer","Barometer","Thermometer"],1,"A barometer is used for atmospheric pressure.","pressure"],
["Pressure equals ...",["Force / area","Area / force","Mass × volume"],0,"P = F/A.","pressure"],

["A metal lid loosens under warm water mainly due to ...",["Thermal expansion","A lower number of atoms","Condensation"],0,"Heating expands the metal lid.","energy"],

["How many Kelvin is 25 °C (approximately)?",["248 K","298 K","25 K"],1,"25 + 273.15 = 298.15 K.","temperature"],
["At constant T and n, pressure versus volume is ...",["Direct","Inverse","Unrelated"],1,"Boyle's law: P₁V₁=P₂V₂.","boyle"],

["At fixed V and T, adding gas particles makes pressure ...",["Rise","Fall","Stay fixed"],0,"More particles cause more collisions.","amount"],

["In the syringe lab, at 5 mL pressure was ...",["99.7 kPa","38.4 kPa","19.5 kPa"],0,"The original lab measurements show 99.7 kPa at 5 mL.","labs"],
["Which particle diagram represents a hotter gas?",["Same number of particles with longer motion arrows","More particles","All particles clustered"],0,"Hotter particles move faster; the particle count need not change.","particles"],
["109 kPa equals approximately how many atm?",["1.08 atm","0.109 atm","10.8 atm"],0,"109/101.3≈1.08.","pressure"],
["0.62 atm equals approximately how many mmHg?",["471 mmHg","760 mmHg","62 mmHg"],0,"0.62×760=471.2.","pressure"],
["Why can gas-law ratios not use Celsius?",["Celsius has a nonzero offset from absolute zero","Celsius is always negative","Pressure uses Fahrenheit"],0,"Direct proportionality requires Kelvin.","temperature"],
["Pressure and particle count are ... at constant T,V.",["Inversely related","Directly related","Independent"],1,"Doubling gas amount roughly doubles pressure under those conditions.","amount"],
["In a solid, particles generally ...",["Vibrate around fixed positions","Move freely throughout container","Never move"],0,"Solids have vibrating particles.","particles"],
["What is an important first step in a PVTn chart?",["Predict how the target variable changes","Cancel all units","Multiply all values"],0,"Determine increase/decrease before choosing ratios.","calculations"],
["In the lab, 6 puffs of air produced ...",["89.7 kPa","19.5 kPa","38.4 kPa"],0,"Your lab table lists 89.7 kPa for six puffs.","labs"],
["A barometer reading can change with ...",["Altitude","Amount of gas in your syringe only","Color of the liquid"],0,"Atmospheric pressure decreases with increased altitude.","pressure"],
["A bicycle tire warms but stays the same size and sealed. Which law applies?",["Boyle's law","Gay-Lussac's law","Charles's law"],1,"At constant volume, P/T is constant.","charles"],
["STP pressure equals approximately ...",["101.3 kPa","10.13 kPa","760 kPa"],0,"Standard pressure is 1 atm.","pressure"],
["A 320 cm³ gas at 1 atm compresses to 200 cm³. Pressure?",["0.625 atm","1.60 atm","2.00 atm"],1,"1×320/200=1.60 atm.","boyle"],
["At 0°C water freezes under standard pressure. This is ...",["273.15 K","0 K","373.15 K"],0,"Convert Celsius to Kelvin by adding 273.15.","temperature"],
["Why might your pressure-temperature lab graph deviate from a perfect trend?",["Experimental leakage or unstable readings","Temperature must always reduce pressure","Pressure has no temperature relationship"],0,"Apparatus leaks and measurements introduce error.","labs"]
];
const KEY="aishaStudyChemUnit2V2";let state;try{state=JSON.parse(localStorage.getItem(KEY))||{completed:[],results:[],wrong:[],flash:{},tasks:[],last:"energy"}}catch{state={completed:[],results:[],wrong:[],flash:{},tasks:[],last:"energy"}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}const app=document.getElementById("app");const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let quiz={index:0,selected:null,answered:false,list:[]};function go(s){location.hash="#/"+s}function progress(){return Math.round(state.completed.length/units.length*100)}function page(){let p=decodeURIComponent(location.hash.replace(/^#\/?/,""))||"";if(!p){app.innerHTML='<section class="hero"><div class="kicker">Aisha\'s Study Lab · Honors Chemistry</div><h1>Study <em>Smarter.</em></h1><p>Your personalized Unit 2 study guide — thermal energy, gas pressure, PVTn, and everything in between.</p><button class="btn" onclick="go(\'topics\')">Explore Study Sections →</button></section><div class="grid"><div class="card"><h3>Study Guides</h3><p>9 lessons created from your worksheets and labs.</p><button class="btn secondary" onclick="go(\'topics\')">Study</button></div><div class="card"><h3>Practice</h3><p>35 questions with explanations and saved mistakes.</p><button class="btn secondary" onclick="startQuiz()">Practice</button></div><div class="card"><h3>Progress</h3><p>'+progress()+'% of lessons completed.</p><div class="bar"><div class="fill" style="width:'+progress()+'%"></div></div></div><div class="card"><h3>Continue Studying</h3><p>'+esc(units.find(u=>u.id===state.last)?.name||units[0].name)+'</p><button class="btn secondary" onclick="go(\'topic/\'+state.last)">Continue →</button></div></div>';return}
if(p==="topics"){app.innerHTML='<p class="kicker">Unit 2 · Honors Chemistry</p><h1>Study <em>Guides</em></h1><p>Select a topic to study its own lesson.</p><div class="grid">'+units.map((u,i)=>'<button class="topic" onclick="go(\'topic/'+u.id+'\')"><span class="mini">0'+(i+1)+' / UNIT 2</span><strong>'+esc(u.name)+'</strong><span class="mini">'+esc(u.brief)+'</span><span class="mini">'+(state.completed.includes(u.id)?"✓ Completed":"Explore →")+'</span></button>').join("")+'</div>';return}
if(p.startsWith("topic/")){let u=units.find(u=>u.id===p.split("/")[1]);if(!u)return go("topics");state.last=u.id;save();let ix=units.indexOf(u);app.innerHTML='<p class="mini">Study Guides / Unit 2 / '+esc(u.name)+'</p><div class="layout"><aside class="sidebar">'+units.map(x=>'<button class="'+(x.id===u.id?"active":"")+'" onclick="go(\'topic/'+x.id+'\')">'+esc(x.name)+'</button>').join("")+'</aside><section><div class="hero" style="padding:30px"><div class="kicker">SECTION '+(ix+1)+' OF '+units.length+'</div><h1 style="font-size:38px">'+esc(u.name)+'</h1><p>'+esc(u.brief)+'</p></div><div class="tabbar"><button class="active">Overview</button><button onclick="showFacts(\''+u.id+'\')">Key Terms</button><button onclick="startQuiz(\''+u.id+'\')">Practice</button></div><div id="topicBody" class="card"><h2>Learn the concept</h2><p>'+esc(u.body)+'</p><h3>What you need to know</h3>'+u.facts.map(f=>'<p>✧ '+esc(f)+'</p>').join("")+'<button class="btn" onclick="complete(\''+u.id+'\')">'+(state.completed.includes(u.id)?"✓ Marked completed":"Mark Lesson Complete")+'</button></div><div style="margin-top:15px" class="row"><button class="btn secondary" onclick="go(\'topic/'+units[Math.max(0,ix-1)].id+'\')">← Previous</button><button class="btn secondary" onclick="go(\'topic/'+units[Math.min(units.length-1,ix+1)].id+'\')">Next →</button></div></section></div>';return}

if(p==="planner"){app.innerHTML='<h1>Study <em>Planner</em></h1><p>Checklist saved on this device.</p><form onsubmit="addTask(event)" class="card"><input class="field" name="task" placeholder="Add a study task" required maxlength="200"><br><br><button class="btn">Add Task</button></form><div class="card" style="margin-top:15px">'+(state.tasks.map((t,i)=>'<div class="row"><label><input type="checkbox" '+(t.done?"checked":"")+' onchange="toggleTask('+i+')"> '+esc(t.text)+'</label><button class="btn secondary" onclick="removeTask('+i+')">Remove</button></div><hr>').join("")||"<p>No tasks yet.</p>")+'</div>';return}
}
function showFacts(id){let u=units.find(x=>x.id===id);document.getElementById("topicBody").innerHTML='<h2>Key concepts · Flashcards</h2>'+u.facts.map((f,i)=>'<div class="note" style="margin:9px 0"><strong>Card '+(i+1)+'</strong><p>'+esc(f)+'</p><button class="btn secondary" onclick="masterCard(\''+id+'\','+i+',this)">'+(state.flash[id+"-"+i]?"✓ Mastered":"Mark mastered")+'</button></div>').join("")}function masterCard(id,i,b){state.flash[id+"-"+i]=!state.flash[id+"-"+i];save();b.textContent=state.flash[id+"-"+i]?"✓ Mastered":"Mark mastered"}function complete(id){if(!state.completed.includes(id))state.completed.push(id);save();page()}function startQuiz(id){quiz={index:0,selected:null,answered:false,list:Q.map((_,i)=>i).filter(i=>!id||Q[i][4]===id)};go("quiz")}function retryWrong(){if(!state.wrong.length){alert("No missed questions saved yet!");return}quiz={index:0,selected:null,answered:false,list:[...state.wrong]};go("quiz")}function renderQuiz(){if(!quiz.list.length){app.innerHTML='<h2>No questions loaded</h2><button class="btn" onclick="go(\'practice\')">Choose Practice</button>';return}let idx=quiz.list[quiz.index],q=Q[idx];app.innerHTML='<div class="row"><div><p class="kicker">Aisha\'s Study Lab · Practice</p><h1 style="font-size:39px">Unit 2 <em>Practice</em></h1></div><span class="mini">Question '+(quiz.index+1)+' of '+quiz.list.length+'</span></div><div class="bar"><div class="fill" style="width:'+Math.round(quiz.index/quiz.list.length*100)+'%"></div></div><div class="card questions" style="margin-top:17px"><h2>'+esc(q[0])+'</h2>'+q[1].map((a,i)=>'<button class="choice '+(quiz.selected===i?"selected ":"")+(quiz.answered?(i===q[2]?"correct":i===quiz.selected?"incorrect":""):"")+'" onclick="choose('+i+')" '+(quiz.answered?"disabled":"")+'>'+String.fromCharCode(65+i)+'. '+esc(a)+'</button>').join("")+(quiz.answered?'<div class="note"><strong>'+(quiz.selected===q[2]?"Correct!":"Review this concept")+'</strong><p>'+esc(q[3])+'</p></div>':"")+'<div style="margin-top:20px"><button class="btn" '+(!quiz.answered&&quiz.selected===null?"disabled":"")+' onclick="'+(quiz.answered?"nextQuestion()":"submitAnswer()")+'">'+(quiz.answered?"Next Question →":"Submit Answer")+'</button></div></div>'}function choose(i){if(quiz.answered)return;quiz.selected=i;renderQuiz()}function submitAnswer(){if(quiz.selected===null)return;quiz.answered=true;let idx=quiz.list[quiz.index];quiz.answers=quiz.answers||[];quiz.answers.push(quiz.selected===Q[idx][2]);if(quiz.selected!==Q[idx][2]){if(!state.wrong.includes(idx))state.wrong.push(idx)}else state.wrong=state.wrong.filter(x=>x!==idx);save();renderQuiz()}function nextQuestion(){quiz.index++;quiz.selected=null;quiz.answered=false;if(quiz.index>=quiz.list.length){let score=(quiz.answers||[]).filter(Boolean).length;state.results.push({date:new Date().toLocaleDateString(),score,total:quiz.list.length});save();app.innerHTML='<div class="hero"><p class="kicker">Assessment complete</p><h1>Your <em>Results</em></h1><h2>'+score+'/'+quiz.list.length+' correct ('+Math.round(score/quiz.list.length*100)+'%)</h2><p>Great work studying! Review mistakes to strengthen your understanding.</p><button class="btn" onclick="go(\'progress\')">View Progress</button> <button class="btn secondary" onclick="retryWrong()">Review Mistakes</button></div>';return}renderQuiz()}function addTask(e){e.preventDefault();let v=e.target.task.value.trim();if(v)state.tasks.push({text:v,done:false});save();page()}function toggleTask(i){state.tasks[i].done=!state.tasks[i].done;save()}function removeTask(i){state.tasks.splice(i,1);save();page()}function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.download="aishas-study-lab-progress.json";a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!Array.isArray(d.completed)||!Array.isArray(d.results))throw Error();state=d;save();page()}catch{alert("This progress file is not valid.")}};reader.readAsText(f)}window.addEventListener("hashchange",page);page();
</script></body></html>
